    + `<br><b>${esc(T('disclaimer.ai'))}</b><br>`
    + esc(T('parts.footDisclaimer', { link: '\u0000' })).replace('\u0000', '<a href="https://github.com/carloxthebot/jimny/issues" target="_blank" rel="noopener">GitHub</a>');
}
document.getElementById('bar').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === b));
  render();
});
document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });

/** The fixed words of the page, the header's picker and the title. */
function applyLocale() {
  const lang = getLang();
  window.__jimnyFont?.(lang);
  document.title = T('parts.meta.title');
  document.querySelector('meta[name=description]')?.setAttribute('content', T('parts.meta.description'));
  document.querySelector('meta[property="og:title"]')?.setAttribute('content', T('parts.meta.title'));
  document.querySelector('meta[property="og:locale"]')?.setAttribute('content', { 'zh-TW': 'zh_TW', en: 'en_US', ja: 'ja_JP' }[lang]);
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T(el.dataset.t);
  for (const el of document.querySelectorAll('[data-ta]'))
    for (const pair of el.dataset.ta.split(',')) { const [a, k] = pair.split(':'); el.setAttribute(a, T(k)); }
  document.getElementById('kicker').textContent = T('parts.kicker', { car: marketName(REGION) });
  document.getElementById('back').href = `app.html?${here()}`;
  document.getElementById('demo').hidden = lang !== 'zh-TW';
  document.getElementById('loc').innerHTML = `<div class="lseg" role="group" aria-label="${esc(T('lang.label'))}">${LANGS.map(l =>
      `<button type="button" data-lang="${l}" lang="${l === 'zh-TW' ? 'zh-Hant' : l}" aria-pressed="${l === lang}">${esc(T('lang.' + l))}</button>`).join('')}</div>`
    + `<label class="lreg"><span>${esc(T('region.label'))}</span><select data-region aria-label="${esc(T('region.label'))}">${REGION_IDS.map(r =>
      `<option value="${r}"${r === REGION ? ' selected' : ''}>${esc(T('region.' + r))} · ${REGIONS[r].currency}</option>`).join('')}</select></label>`;
}
async function switchLocale(lang, region) {
  if (region && REGIONS[region]) { REGION = region; setRegion(region); }
  if (lang && lang !== getLang()) localizeCatalogue(PARTS, await setLang(lang, { persist: true }));
  const u = new URL(location.href);
  u.searchParams.set('lang', LANG_URL[getLang()]); u.searchParams.set('region', REGION);
  try { history.replaceState(history.state, '', u); } catch {}
  applyLocale(); render();
}
const loc = document.getElementById('loc');
loc.addEventListener('click', (e) => { const b = e.target.closest('[data-lang]'); if (b) switchLocale(b.dataset.lang, null); });
loc.addEventListener('change', (e) => { if (e.target.matches('[data-region]')) switchLocale(null, e.target.value); });

localizeCatalogue(PARTS, await setLang(LANG_Q ?? detectLang(REGION)).catch(() => setLang('zh-TW')));
applyLocale();
render();

/* Official demo cars, matched against the catalogue. A "套用" link carries
   only the parts the catalogue actually has, so it opens the closest build
   the configurator can show -- and the card says what is missing. */
const LISTS = Object.fromEntries(CATS().filter(c => c[1]).map(c => [c[1], c[2]]));
const SLOT = { spareCover: 'spareCoverKit' };
const has = (key, id) => id && id !== 'missing' && (LISTS[key] ?? []).some(x => x.id === id);
if (getLang() === 'zh-TW') fetch('docs/jb74-demo-cars.json').then(r => r.json()).then(d => {
  const cars = d.demoCars.filter(c => /JB74/.test(c.chassis));
  document.getElementById('demoN').textContent = T('parts.demo.count', { n: cars.length });
  document.getElementById('demoGrid').innerHTML = cars.map(c => {
    const rows = [], q = new URLSearchParams();
    const line = (label, key, id, text) => { const ok = has(key, id); if (ok) q.set(key, id); rows.push(`<li class="${ok ? 'ok' : 'no'}">${esc(T('parts.demo.line', { label, text: text || T('parts.demo.notStated') }))}</li>`); };
    if (c.color?.code && LISTS.color?.some(x => x.id === c.color.code)) { q.set('color', c.color.code); if (c.color.twoTone) q.set('twoTone', 'true'); }
    line(T('parts.demo.part.lift'), 'lift', c.lift?.id, [c.lift?.product, c.lift?.mm ? `${c.lift.mm}mm` : ''].filter(Boolean).join(' '));
    line(T('parts.demo.part.wheel'), 'wheel', c.wheel?.id, [c.wheel?.brand, c.wheel?.model, c.wheel?.size].filter(Boolean).join(' '));
    line(T('parts.demo.part.tyre'), 'tyre', c.tyre?.sizeId, [c.tyre?.brand, c.tyre?.model, c.tyre?.size].filter(Boolean).join(' '));
    if (has('tread', c.tyre?.modelId)) q.set('tread', c.tyre.modelId);
    const PART = ['frontBumper', 'rearBumper', 'grille', 'fender', 'hood', 'spoiler', 'exhaust', 'sideStep', 'roofRack', 'face', 'mirrors', 'spareCoverKit'];
    for (const p of c.parts ?? []) {
      const key = SLOT[p.slot] ?? p.slot;
      line(T('parts.demo.part.' + (PART.includes(key) ? key : 'other')), key, p.id, p.product);
    }
    const n = [...q.keys()].filter(k => k !== 'twoTone').length;
    return `<div class="card demo"><div class="top"><div><b>${esc(c.name)}</b><div class="brand">${esc(c.maker)}</div></div></div>
      ${c.silhouette ? `<div class="sil">${esc(c.silhouette)}</div>` : ''}
      <ul>${rows.join('')}</ul>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
      <div class="acts"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(T('parts.demo.page'))}</a>${n ? `<a class="apply" href="app.html?${q}">${esc(T('parts.demo.applyN', { n }))}</a>` : ''}</div></div>`;
  }).join('');
}).catch(() => { document.getElementById('demoGrid').innerHTML = `<div class="empty">${esc(T('parts.demo.failed'))}</div>`; });
</script>

</body>
